<!-- File: index.html -->
<!-- Description: Meme movement with sound -->

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Page title -->
    <title>Sound Meme Machine</title>

    <!-- Styling for better UX -->
    <style>

        body {
            background-color: black;
            color: lime;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #memeImage {
            position: absolute;
            width: 200px;
            left: 100px;
            top: 150px;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <!-- Page heading -->
    <h1>🔊 Sound Meme Machine 🔊</h1>

    <!-- Form required -->
    <form onsubmit="return startEverything();">

        <!-- Start button -->
        <button id="startBtn" type="submit">Start</button>

        <!-- Stop button -->
        <button id="stopBtn" type="button" onclick="stopEverything();" disabled>Stop</button>

    </form>

    <!-- Meme image -->
    <img id="memeImage" src="meme.jpg" alt="Meme">

    <!-- Status message -->
    <div id="status"></div>

    <!-- Audio element -->
    <audio id="soundEffect" src="sound.mp3"></audio>

    <!-- External JS -->
    <script src="sound.js"></script>

</body>
</html>
